name: "问题反馈 / Bug report"
description: "安装失败、解析遗漏、续做或复习内容问题 / Installation, extraction, resume, or content problems"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        谢谢帮我们把复习体验变好。中英文都可以！
        Thanks for helping improve the revision experience. Chinese and English are welcome.

        **这是公开 Issue。不要上传真实课件、个人笔记、账号信息或完整聊天记录。**
        **Issues are public. Do not upload private course files, notes, credentials, or full chat histories.**
        请用原创的最小示例复现；文件名、路径、截图和日志也需要脱敏。
        Use a small original example. Redact filenames, paths, screenshots, and logs too.
  - type: dropdown
    id: area
    attributes:
      label: "哪里出了问题？ / Area"
      options:
        - "安装或发现 Skill / Installation or discovery"
        - "PDF、DOCX、PPTX 解析 / Extraction"
        - "继续上次进度 / Resume"
        - "讲解、例题或答案 / Notes, examples, or answers"
        - "引用或覆盖范围 / Citations or coverage"
        - "其他 / Other"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "运行环境 / Environment"
      description: "操作系统、AI 工具及版本、Python 版本、仓库提交或下载日期。不确定可写未知。 / OS, host/version, Python version, and commit or download date. Unknown is okay."
      placeholder: "Windows 11; Codex …; Python 3.12; commit …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "如何重现？ / Steps to reproduce"
      description: "输入格式、模式、操作步骤；可以只贴脱敏后的提示词或命令。 / File type, mode, and steps. Include a redacted prompt or command if useful."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期待什么，实际发生了什么？ / Expected and actual result"
      description: "如果是答案问题，请指出具体题目、错误步骤和可核对的依据，不要公开受限课程材料。 / For content issues, identify the question, incorrect step, and verifiable reasoning without sharing restricted materials."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "补充信息 / Optional details"
      description: "脱敏后的错误信息、小型原创复现或截图。可以留空。 / Redacted errors, a small original reproduction, or screenshots. Optional."
  - type: checkboxes
    id: privacy
    attributes:
      label: "公开前检查 / Before posting"
      options:
        - label: "我已移除私人信息，且有权公开附上的示例。 / I removed private information and may share the included examples publicly."
          required: true
